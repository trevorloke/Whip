<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Floor Fight</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- MENU -->
  <section id="menu" class="screen">
    <div class="menu-inner">
      <div class="logo">
        <div class="logo-gavel">⚖</div>
        <h1>FLOOR<span>FIGHT</span></h1>
        <p class="tag">The United States Senate. 100 seats. Count the votes, twist the arms, survive the roll call and the next election.</p>
      </div>
      <div class="menu-buttons">
        <div class="side-pick"><button id="btn-new-d" class="btn big dem">Whip for the Democrats</button><button id="btn-new-r" class="btn big rep">Whip for the Republicans</button></div>
        <button id="btn-continue" class="btn big">Continue Career</button>
        <button id="btn-how" class="btn ghost big">How to Play</button>
      </div>
      <div id="records" class="records"></div>
    </div>
  </section>

  <!-- GAME -->
  <section id="game" class="screen hidden">
    <header id="topbar"></header>
    <main id="board">
      <div id="left">
        <div id="bill"></div>
        <div id="chamber-wrap">
          <div class="viewtabs"><button class="btn" data-view="chamber">Chamber</button><button class="btn" data-view="map">Map</button></div><svg id="chamber" viewBox="-285 -272 570 300"></svg>
          <div id="count"></div>
        </div>
        <div id="floor-actions"></div>
      </div>
      <div id="right">
        <div id="member"></div>
        <div id="log"></div>
      </div>
    </main>
  </section>

  <div id="modal" class="modal hidden"><div class="modal-card" id="modal-card"></div></div>
  <div id="toasts"></div>
</div>
<script src="game.js"></script>
<script src="content.js"></script>
<script src="night.js"></script>
</body>
</html>
