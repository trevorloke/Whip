<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Floor Fight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;600;800&family=Old+Standard+TT:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="primaries.css">
<link rel="stylesheet" href="convention.css">
<link rel="stylesheet" href="campaign.css">
<link rel="stylesheet" href="midterm.css">
<link rel="stylesheet" href="results.css">
<link rel="stylesheet" href="events.css">
<link rel="stylesheet" href="wing.css">
</head>
<body>
<div id="app">
  <!-- MENU -->
  <section id="menu" class="screen">
    <div class="hero" id="hero"></div>
    <div class="menu-inner">
      <div class="logo">
        <div class="kick">★ The United States Senate ★</div>
        <h1>FLOOR <span>FIGHT</span></h1>
        <p class="tag">100 senators. 50 states. One whip. Count the votes, twist the arms, survive the roll call and the next election.</p>
      </div>
      <div class="menu-buttons">
        <div class="side-pick"><button id="btn-new-d" class="btn big dem"><span class="emb">★</span> Whip for the Democrats</button><button id="btn-new-r" class="btn big rep"><span class="emb">★</span> Whip for the Republicans</button></div>
        <div class="side-pick"><button id="btn-continue" class="btn big">Continue Career</button><button id="btn-how" class="btn ghost big">How to Play</button></div>
      </div>
      <div id="records" class="records"></div>
      <div id="legacy" class="legacy"></div>
    </div>
  </section>

  <!-- GAME -->
  <section id="game" class="screen hidden">
    <header id="topbar"></header>
    <main id="board">
      <div id="left">
        <div id="bill"></div>
        <div id="chamber-wrap">
          <div class="viewtabs"><button class="btn" data-view="chamber">Chamber</button><button class="btn" data-view="map">Map</button><button class="btn" data-view="factions">Factions</button></div><svg id="chamber" viewBox="-285 -272 570 300"></svg><div id="facview" class="hidden"></div><div id="mapview" class="hidden"></div>
          <div id="count"></div>
        </div>
        <div id="floor-actions"></div>
      </div>
      <div id="right">
        <div id="member"></div>
        <div id="log"></div>
      </div>
    </main>
  </section>

  <div id="modal" class="modal hidden"><div class="modal-card" id="modal-card"></div></div>
  <div id="toasts"></div>
</div>
<script src="game.js"></script>
<script src="content.js"></script>
<script src="names.js"></script>
<script src="usmap.js"></script>
<script src="art.js"></script>
<script src="depth.js"></script>
<script src="world.js"></script>
<script src="primaries.js"></script>
<script src="convention.js"></script>
<script src="campaign.js"></script>
<script src="midterm.js"></script>
<script src="events.js"></script>
<script src="wing.js"></script>
<script src="night.js"></script>
<script src="results.js"></script>
<script>showMenu();</script>
</body>
</html>
